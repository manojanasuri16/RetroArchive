description: |
  **Google Maps for S60** is the Symbian build of Google Maps, for S60 3rd Edition and 5th Edition phones. The file is dated 2010 in its name.

  Map tiles come from Google's servers, so the app needs a data connection. Google has retired this old client, so the map data may no longer load. Check before relying on it.
