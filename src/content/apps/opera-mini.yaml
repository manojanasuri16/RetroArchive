description: |
  **Opera Mini** 8.00 is the Java ME build of Opera's proxy-based mobile browser. Pages are compressed by Opera's servers, which made it fast on slow connections.

  The Opera Mini servers for this old version may no longer work. Check that it connects before relying on it.

  MIDP 2.0 / CLDC 1.0. The .jad lists the permissions it asks for: HTTP access, plus optional file, SMS and socket access.
