description: |
  **UserAgent** is a small tool by Razumey that changes the user-agent string of the phone's built-in Symbian browser. Some websites serve an old or cut-down page, or refuse an old browser outright, depending on the user agent it reports. Selecting a newer profile can make the site open its normal page instead.

  ### Profiles included

  - Symbian^3 (Nokia N8-00) and Nokia 603
  - iPhone (iOS 5.0 and 5.1.1)
  - Firefox 13
  - Opera 12.02
  - Internet Explorer Mobile 10 (Windows Phone 8)
  - HTC and Samsung Galaxy Tab

  Choose one profile from the app's list and apply it.

  ### Compatibility

  The file is labelled **S60 5th Edition and Symbian^3** and is unsigned. It is not confirmed on S60 3rd Edition phones such as the N79. If you only need pages that work in a different browser, [Opera Mini](/apps/opera-mini/) is the safer choice on the N79.
