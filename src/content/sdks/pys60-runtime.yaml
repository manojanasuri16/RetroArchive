description: |
  **Python for S60 1.4.5** runs Python 2.2 scripts and apps on Nokia S60 3rd Edition phones, including the **Nokia N79**. Nokia open-sourced the project (PyS60).

  Install it once, on the phone. Every PyS60 app in this archive ([RetroSend](/apps/retrosend/), [RetroTele](/apps/retrotele/), [RetroTorch](/apps/retrotorch/)) needs it.

  For the N79 (S60 3rd Edition FP2) use:

  - `PythonForS60_1_4_5_3rdEd.sis`: the runtime
  - `PythonScriptShell_1_4_5_3rdEd.SIS`: the Python Script Shell, for running a `.py` file without installing it as an app

  Nokia's runtime certificate has expired. The [install guide](/guides/install-pys60/) explains how to install it anyway.
