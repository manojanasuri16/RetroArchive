description: |
  The **GCCE** compiler (`arm-none-symbianelf-gcc` 3.4.3, 2005Q1C), prebuilt for i686 Linux. It was made by CodeSourcery and is the free alternative to ARM RVCT for S60 3rd Edition. The [Symbian S60v3 toolchain](/sdks/symbian-s60v3-toolchain/) unpacks it.
