description: |
  The **Nokia S60 3rd Edition FP2 SDK**, version 1.1.1, is a Windows InstallShield package. The [Symbian S60v3 toolchain](/sdks/symbian-s60v3-toolchain/) unpacks it on Linux with `unshield`, and it becomes `EPOCROOT`.

  This copy is mirrored here for preservation. The copy is byte-for-byte the same as the one the toolchain uses (SHA-1 `53995d55bd8227647759d208a450501629295342`).
