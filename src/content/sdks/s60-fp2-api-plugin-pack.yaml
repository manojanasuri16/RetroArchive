description: |
  The **FP2 API Plug-In Pack 1.3** is a set of extra APIs for the S60 3rd Edition FP2 SDK. The public SDK does not include the ECam *Advanced Settings* API, which is needed for camera flash and video light control. The [Symbian S60v3 toolchain](/sdks/symbian-s60v3-toolchain/) copies that API into the SDK. The other APIs in the pack are not used by the toolchain.

  Nokia's licence does not allow re-hosting, so this entry links to the archive.org copy only. The copy is byte-for-byte the same as the one the toolchain uses (SHA-1 `03a57ab6df56c127f30729b82429820d8eaf3251`).
