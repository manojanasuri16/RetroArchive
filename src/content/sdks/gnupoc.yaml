featured: false
rehostable: true
description: |
  **GnuPoc** by Martin Storjö made Symbian development on Linux possible. It contains the SDK installers (`install_gnupoc_s60_32`, `install_wrapper`) and the sources of native SDK tools such as `elf2e32`, `petran`, `bmconv`, `rcomp`, `mifconv` and `genstubs`.

  The [Symbian S60v3 toolchain](/sdks/symbian-s60v3-toolchain/) uses GnuPoc 1.22, with patches for modern Linux.
