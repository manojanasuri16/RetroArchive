notes: |
  The N82 is the black, xenon-flash Nseries: a candybar with a keypad, a 240x320 screen and a camera that still holds up against phones of its year. It runs S60 3rd Edition **FP1** (S60 3.1) on Symbian OS 9.2, which is one edition older than the N79's FP2.

  **Building.** FP1 and FP2 are not interchangeable. The [S60 3.2 SDK](/sdks/s60-3-2-sdk/) and the [S60v3 toolchain](/sdks/symbian-s60v3-toolchain/) on this site target FP2, so they build for the N79 and not for the N82. An FP1 phone needs the S60 3rd Edition FP1 SDK instead; the [build guide](/guides/build-native-on-linux/) explains the same setup with the FP2 packages swapped for FP1.

  **Python.** Python for S60 1.4.5 is the S60 3rd Edition runtime and covers FP1 as well; the [install guide](/guides/install-pys60/) walks through it on the N79, and the steps on the phone are the same.

  **Signing and installing.** The N82 takes the same `.sis` / `.sisx` files and answers to the same signing rules. The [unlock guide](/guides/unlock-n79/) and EasyHackKit 2.0 are written around the N79, but they are the standard S60v3 route. The same goes for [installing Java apps](/guides/install-java-apps/) and [memory card installs](/guides/memory-card-installs/).

  **Camera.** A 5 MP sensor behind a Tessar 2.8/5.6 lens, with a real xenon flash and a sliding cover that starts the camera when you open it. Xenon is a one-shot flash, not a torch, so the LED light tricks written for the N79's dual LED do not carry over.

  **Keypad.** The keys are small and laid out around the nav cluster; it is the N82's most complained-about part and it takes some getting used to.
